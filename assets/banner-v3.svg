<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="clxcht — whoami --json">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0b14"/>
      <stop offset="1" stop-color="#17112a"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f4eefc"/>
      <stop offset="1" stop-color="#c9b4ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.35" r="0.45">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <style>
      .serif { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif; }
      .mono  { font-family: "JetBrains Mono", "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .jp    { font-family: "Noto Serif JP", "Hiragino Mincho ProN", "Yu Mincho", serif; }
      .star  { fill: #e9ddff; animation: twinkle 4s ease-in-out infinite; }
      .s2 { animation-delay: .8s } .s3 { animation-delay: 1.6s } .s4 { animation-delay: 2.4s } .s5 { animation-delay: 3.2s }
      @keyframes twinkle { 0%,100% { opacity: .15 } 50% { opacity: .9 } }
      .rise { animation: rise 1s ease-out both; }
      .d1 { animation-delay: .15s } .d2 { animation-delay: .35s } .d3 { animation-delay: .55s }
      @keyframes rise { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0 } }
    </style>
  </defs>

  <rect width="1200" height="340" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="340" rx="18" fill="url(#glow)"/>

  <!-- stars -->
  <circle class="star"    cx="905"  cy="38"  r="1.6"/>
  <circle class="star s2" cx="1010" cy="118" r="1.2"/>
  <circle class="star s3" cx="1120" cy="120"  r="1.8"/>
  <circle class="star s4" cx="960"  cy="210" r="1.1"/>
  <circle class="star s5" cx="1080" cy="255" r="1.5"/>
  <circle class="star s3" cx="845"  cy="150" r="1"/>
  <circle class="star s2" cx="1150" cy="180" r="1.1"/>
  <circle class="star s4" cx="760"  cy="48"  r="1"/>

  <!-- big kanji watermark -->
  <text class="jp" x="1105" y="285" text-anchor="end" font-size="230" fill="#c9b4ff" fill-opacity="0.09">星</text>

  <text class="serif rise d1" x="68" y="116" font-size="96" font-style="italic" fill="url(#ink)" letter-spacing="-2">clxcht</text>

  <text class="serif rise d2" x="74" y="154" font-size="24" fill="#d9ccf5">me and le boys (claude and gpt)</text>

  <g class="mono rise d3" font-size="16" xml:space="preserve" style="white-space:pre">
    <text x="74" y="192"><tspan fill="#8f7cc0">~ $ </tspan><tspan fill="#f4eefc">whoami --json</tspan></text>
    <text x="74" y="214"><tspan fill="#8f7cc0">{</tspan></text>
    <text x="74" y="234"><tspan fill="#8f7cc0">  </tspan><tspan fill="#c9b4ff">"name"</tspan><tspan fill="#8f7cc0">: </tspan><tspan fill="#f9a8d4">"clxcht"</tspan><tspan fill="#8f7cc0">,</tspan></text>
    <text x="74" y="254"><tspan fill="#8f7cc0">  </tspan><tspan fill="#c9b4ff">"builds"</tspan><tspan fill="#8f7cc0">: </tspan><tspan fill="#f9a8d4">["desktop companions", "study apps", "games"]</tspan><tspan fill="#8f7cc0">,</tspan></text>
    <text x="74" y="274"><tspan fill="#8f7cc0">  </tspan><tspan fill="#c9b4ff">"runs"</tspan><tspan fill="#8f7cc0">: </tspan><tspan fill="#f9a8d4">"gentoo + hyprland"</tspan><tspan fill="#8f7cc0">,</tspan></text>
    <text x="74" y="294"><tspan fill="#8f7cc0">  </tspan><tspan fill="#c9b4ff">"learning"</tspan><tspan fill="#8f7cc0">: </tspan><tspan fill="#f9a8d4">"日本語"</tspan><tspan fill="#8f7cc0"></tspan></text>
    <text x="74" y="314"><tspan fill="#8f7cc0">}</tspan><tspan class="cursor" fill="#c9b4ff"> ▌</tspan></text>
  </g>
</svg>
